name: GG Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'godot/**'
      - '.github/workflows/build-gg.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build GG Android APK
        run: |
          docker run --rm \
            -v "$PWD/godot:/project" \
            barichello/godot-ci:4.4.1 \
            godot --headless --path /project \
            --verbose --export-debug "Android" /project/GG.apk

      - name: Upload GG APK
        uses: actions/upload-artifact@v4
        with:
          name: GG-Android-APK
          path: godot/GG.apk
